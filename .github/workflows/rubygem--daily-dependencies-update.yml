# This workflow updates gem dependencies every day and opens a pull request
# when any dependency changes are detected.

name: RubyGem - Daily Dependencies Update

on:
  schedule:
    # 0:00 JST every day
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update_gem_dependencies:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-ruby
        with:
          job-name: update_gem_dependencies
      - name: Relax Gemfile Pins to Each Major Version
        working-directory: ./RubyGem
        run: |
          # The mirror step below pins every gem to `~> <locked version>`, which
          # caps the next update at the locked minor release (or, for four-segment
          # versions such as Rails 8.1.3.1, at the locked patch release). Widen each
          # pin to its major version first (minor version for 0.x gems) so minor
          # and patch releases of frameworks and libraries can land; the mirror
          # step re-pins them. Major upgrades stay manual.
          ruby <<'RUBY'
          gemfile = File.read('Gemfile').gsub(/^(\s*gem '[^']+', )'~> (\d+)(?:\.(\d+))?[^']*'/) do
            "#{$1}'~> #{$2 == '0' ? "0.#{$3 || 0}.0" : "#{$2}.0"}'"
          end
          File.write('Gemfile', gemfile)
          RUBY
      - name: Update Gem Dependencies
        working-directory: ./RubyGem
        env:
          BUNDLE_FROZEN: "false"
        run: |
          gem update --system
          gem install bundler
          bundle update --bundler
          bundle update --all
      - name: Mirror Updated Versions to Gemfile
        working-directory: ./RubyGem
        env:
          BUNDLE_FROZEN: "false"
        run: |
          ruby <<'RUBY'
          versions = File.read('Gemfile.lock').scan(/^    (\S+) \((\d+(?:\.\d+)*)\)$/).to_h
          gemfile = File.read('Gemfile').gsub(/^(\s*gem '([^']+)', )'~> [^']+'/) do
            versions[$2] ? "#{$1}'~> #{versions[$2]}'" : $~[0]
          end
          File.write('Gemfile', gemfile)
          RUBY
          bundle lock --add-checksums
      - name: Generate Pull Request Description
        env:
          BODY_PATH: ${{ runner.temp }}/pr_body.md
        run: |
          {
            cat <<'OVERVIEW'
          ## 1. Overview

          This pull request was created automatically by the RubyGem - Daily Dependencies Update workflow.
          It upgrades RubyGems and Bundler, widens every Gemfile pin to its major version (minor version for 0.x gems) so that minor and patch releases of frameworks such as Rails can land, updates every gem to the latest version within those bounds, mirrors the updated versions to the Gemfile, mirrors the new Bundler and gem versions to the Environment section of every README.md that documents them, and re-locks Gemfile.lock so its DEPENDENCIES section stays in sync with the Gemfile:

          ~~~console
          gem update --system
          gem install bundler
          bundle update --bundler
          bundle update --all
          ~~~

          ## 2. Key Changes & Differences
          OVERVIEW
            echo
            bash .github/scripts/dependency_report.sh gem RubyGem/Gemfile.lock RubyGem/Gemfile Gems
            cat <<SUMMARY

          ## 3. Summary

          All gem dependencies in RubyGem/Gemfile and RubyGem/Gemfile.lock are now up to date.
          Please make sure that all CI workflows pass before merging this pull request.

          ## 4. References

          - [RubyGem - Daily Dependencies Update workflow run](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)
          - [bundle update documentation](https://bundler.io/man/bundle-update.1.html)
          - [RubyGems](https://rubygems.org/)
          SUMMARY
          } > "$BODY_PATH"
      - name: Compute Timestamp
        run: echo "TIMESTAMP=$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M:%S JST')" >> "$GITHUB_ENV"
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          sign-commits: true
          branch: hayat01sh1da/daily/rubygem/update-rubygems-dependencies
          delete-branch: true
          add-paths: |
            RubyGem/Gemfile
            RubyGem/Gemfile.lock
            README.md
            RubyGem/README.md
          commit-message: "[Daily][RubyGem] Update RubyGems dependencies at ${{ env.TIMESTAMP }}"
          title: "[Daily][RubyGem] Update RubyGems Dependencies"
          body-path: ${{ runner.temp }}/pr_body.md
          reviewers: hayat01sh1da
          assignees: hayat01sh1da
